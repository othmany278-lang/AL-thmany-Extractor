name: Build AL-thmany Extractor Hybrid Profiles APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: al-thmany-extractor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Validate source contract
        run: python3 scripts/validate_release.py

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace --console=plain

      - name: Lint
        run: gradle :app:lintDebug --no-daemon --stacktrace --console=plain

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee build.log

      - name: Prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n1)"
          test -n "$APK"
          mkdir -p output
          cp "$APK" output/AL-thmany-Extractor-HybridProfiles-2.15.0-debug.apk
          sha256sum output/AL-thmany-Extractor-HybridProfiles-2.15.0-debug.apk > output/AL-thmany-Extractor-HybridProfiles-2.15.0-debug.apk.sha256
          ls -lh output

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AL-thmany-Extractor-HybridProfiles-2.15.0-APK
          path: output/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AL-thmany-Extractor-HybridProfiles-2.15.0-Build-Log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
