name: WhatsApp Join E2E Test

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whatsapp-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  whatsapp-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Validate WhatsApp E2E contract
        run: python3 scripts/whatsapp_e2e_contract_check.py

      - name: Build app, test APK and WhatsApp simulator
        shell: bash
        run: |
          set -o pipefail
          gradle \
            :app:assembleDebug \
            :app:assembleDebugAndroidTest \
            :whatsapp-simulator:assembleDebug \
            --no-daemon --stacktrace --console=plain 2>&1 | tee e2e-build.log

      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run real Accessibility link-to-link E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash "$GITHUB_WORKSPACE/scripts/run_whatsapp_e2e.sh"

      - name: Show E2E result in GitHub Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## WhatsApp Join E2E"
            echo
            if grep -Eq 'OK \([0-9]+ tests?\)' e2e-result.txt 2>/dev/null && ! grep -q 'NAVIGATION_FAILURE' e2e-logcat.txt 2>/dev/null; then
              echo "**✅ PASS — آلية الفحص والانضمام والتنقل نجحت على محاكي Android**"
            else
              echo "**❌ FAIL — افتح خطوة Run real Accessibility link-to-link E2E لمعرفة مكان الفشل**"
            fi
            echo
            echo "| الفحص | النتيجة |"
            echo "|---|---|"
            grep -q 'CLICK_JOIN.*type=GROUP' e2e-logcat.txt 2>/dev/null && echo "| Join group | ✅ |" || echo "| Join group | ❌ |"
            grep -q 'CLICK_REQUEST' e2e-logcat.txt 2>/dev/null && echo "| Request to join | ✅ |" || echo "| Request to join | ❌ |"
            grep -q 'CLICK_JOIN.*type=COMMUNITY' e2e-logcat.txt 2>/dev/null && echo "| Join community | ✅ |" || echo "| Join community | ❌ |"
            grep -q 'CLICK_CONFIRM' e2e-logcat.txt 2>/dev/null && echo "| Continue / Confirm | ✅ |" || echo "| Continue / Confirm | ❌ |"
            grep -q 'CLOSE code=' e2e-logcat.txt 2>/dev/null && echo "| X / Close | ✅ |" || echo "| X / Close | ❌ |"
            grep -q 'BACK code=' e2e-logcat.txt 2>/dev/null && echo "| Back fallback | ✅ |" || echo "| Back fallback | ❌ |"
            ! grep -q 'NAVIGATION_FAILURE' e2e-logcat.txt 2>/dev/null && echo "| Next-link progression | ✅ |" || echo "| Next-link progression | ❌ |"
            grep -q 'JOIN_ONLY PASS' e2e-logcat.txt 2>/dev/null && echo "| JOIN_ONLY result verification | ✅ |" || echo "| JOIN_ONLY result verification | ❌ |"
            grep -q 'SCAN_ONLY PASS' e2e-logcat.txt 2>/dev/null && echo "| SCAN_ONLY no-click verification | ✅ |" || echo "| SCAN_ONLY no-click verification | ❌ |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload WhatsApp E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WhatsApp-E2E-Report
          path: |
            whatsapp-e2e-report.txt
            e2e-result.txt
            e2e-logcat.txt
            e2e-screen.png
            e2e-accessibility.txt
            e2e-window.xml
            e2e-app-launch.txt
            e2e-build.log
          if-no-files-found: ignore
          retention-days: 14
